<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>셀러딧</title>
    <meta name="theme-color" content="#ffffff" />
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f8; color: #111827; }
      main { width: min(320px, calc(100vw - 48px)); padding: 24px; border: 1px solid #e5e7eb; border-radius: 18px; background: #fff; text-align: center; }
      strong { display: block; font-size: 20px; line-height: 28px; }
      p { margin: 10px 0 0; color: #64748b; font-size: 14px; line-height: 21px; }
      a { display: inline-flex; margin-top: 18px; min-height: 42px; align-items: center; justify-content: center; padding: 0 16px; border-radius: 999px; background: #111827; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <strong>셀러딧을 불러오는 중입니다</strong>
      <p>네트워크 연결을 확인한 뒤 커뮤니티로 이동합니다.</p>
      <a href="https://wingcoupang.site/community">셀러딧 열기</a>
    </main>
  </body>
</html>
